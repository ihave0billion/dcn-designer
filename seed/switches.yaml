# DCN Designer — switches library seed
#
# One-time manual transcription from N9K.md (the authoritative source).
# After first run, copied into ~/DCN-Designer/library/switches.yaml and
# edited via the Library UI or hand-edits to that file.
#
# Fields:
#   id                : Cisco product ID (matches a row in N9K.md)
#   role              : spine | leaf | both
#   category          : grouping label for the library UI
#   primary           : main port group (host-facing for leaves, downlinks for spines)
#   uplink            : higher-speed uplink group (leaves), or null
#   secondary_uplink  : secondary uplink group when present, or null
#   capabilities      : flat boolean record
#   aci_note          : free text when ACI support has nuance N9K.md spells out
#   availability      : available | future | eos
#   available_from    : ISO-ish hint when availability != available
#
# Many ru / power_w / data_sheet_url fields are null because N9K.md does
# not specify them. Fill in via the Library UI or data sheets later.

