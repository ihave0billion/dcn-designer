# DCN Designer — IPN routers library seed
#
# IPN (Inter-Pod Network) routers connect spine layers across multiple
# ACI pods in a Multi-Pod fabric. Each spine in each pod reserves a
# small number of ports (Cisco reference: 4 ports per spine per IPN) to
# carry intra-fabric VXLAN encapsulation between pods. The IPN itself
# runs NX-OS (OSPF/BGP + PIM Bidir + DHCP relay + jumbo MTU) — it does
# not need to be an ACI device, only to terminate the spine-facing
# links at the right speed.
#
# Source: the 100G and 400G spine-capable (role: both) Nexus 9300
# models from seed/switches.yaml. These are duplicated here under an
# IPN role to keep library concerns separate (per the Phase 2b
# decision to ship a dedicated ipn_routers.yaml rather than overload
# the switches.yaml role enum). Add or prune models via the Library UI
# in Phase 9b.
#
# Fields:
#   id            : Cisco product ID
#   model_display : human-readable name shown in dropdowns
#   vendor        : "Cisco" (or "Third-party" — not yet seeded)
#   primary       : the port group used to terminate spine-IPN cables
#   ru            : rack units (null when not specified in switches.yaml)
#   power_w       : nameplate / typical power draw in W (null when unspecified)
#   capabilities  : flat boolean record — only flags relevant to IPN role
#   availability  : available | future | eos
#   notes         : free-text (typical role-specific guidance)

schema_version: 1
ipn_routers:

  # ──────────────────────────────────────────────────────────────────
  # 100G spine-capable (role: both in switches.yaml)
