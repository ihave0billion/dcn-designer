<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      'wasm-unsafe-eval' + data: in connect-src are for the PDF export (Phase 9):
      @react-pdf/renderer ships its layout engine as WebAssembly inlined as a
      data: URI, so it needs to fetch that URI and instantiate the module.
      Neither directive permits remote code — script-src stays 'self' only.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: data: blob:; worker-src 'self' blob:" />
    <title>DCN Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
